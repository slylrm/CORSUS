<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarama Raporu - {{ app_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid #667eea;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .target {
            color: #667eea;
            font-size: 1.3em;
            font-weight: 600;
        }
        
        .exec-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .exec-summary h2 {
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        
        .exec-summary p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid;
        }
        
        .summary-card.critical { border-color: #d32f2f; }
        .summary-card.high { border-color: #f57c00; }
        .summary-card.medium { border-color: #fbc02d; }
        .summary-card.low { border-color: #388e3c; }
        .summary-card.info { border-color: #1976d2; }
        .summary-card.total { border-color: #667eea; }
        
        .summary-card .number {
            font-size: 3em;
            font-weight: bold;
            color: #333;
        }
        
        .summary-card .label {
            color: #666;
            margin-top: 5px;
            font-size: 1.1em;
        }
        
        .section {
            margin: 40px 0;
        }
        
        .section h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .findings-list {
            margin-top: 20px;
        }
        
        .finding {
            background: white;
            border: 2px solid #e0e0e0;
            border-left: 5px solid;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .finding:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }
        
        .finding.critical { border-left-color: #d32f2f; }
        .finding.high { border-left-color: #f57c00; }
        .finding.medium { border-left-color: #fbc02d; }
        .finding.low { border-left-color: #388e3c; }
        .finding.info { border-left-color: #1976d2; }
        
        .finding-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .finding-title {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
        }
        
        .risk-badge {
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .risk-badge.critical { background: #d32f2f; }
        .risk-badge.high { background: #f57c00; }
        .risk-badge.medium { background: #fbc02d; color: #000; }
        .risk-badge.low { background: #388e3c; }
        .risk-badge.info { background: #1976d2; }
        
        .finding-details {
            margin: 15px 0;
        }
        
        .finding-details p {
            margin: 10px 0;
            line-height: 1.6;
            color: #555;
        }
        
        .finding-details strong {
            color: #333;
        }
        
        .recommendation {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }
        
        .recommendation strong {
            color: #2e7d32;
        }
        
        .metadata {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
            color: #666;
        }
        
        .recommendations-section {
            background: #fff3e0;
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid #ff9800;
        }
        
        .recommendations-section h3 {
            color: #e65100;
            margin-bottom: 15px;
        }
        
        .recommendations-section ul {
            list-style-position: inside;
            line-height: 2;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .loading {
            text-align: center;
            padding: 60px;
        }
        
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media print {
            body {
                background: white;
            }
            
            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Rapor yükleniyor...</p>
        </div>
        
        <div id="reportContent" style="display: none;"></div>
    </div>
    
    <script>
        const scanId = window.location.pathname.split('/').pop();
        
        async function loadReport() {
            try {
                const response = await fetch(`/api/v1/reports/${scanId}/detailed`);
                
                if (!response.ok) {
                    throw new Error('Rapor yüklenemedi');
                }
                
                const data = await response.json();
                
                // Loading gizle
                document.getElementById('loading').style.display = 'none';
                document.getElementById('reportContent').style.display = 'block';
                
                // Raporu oluştur
                renderReport(data);
                
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <h2 style="color: #d32f2f;">❌ Hata</h2>
                    <p>${error.message}</p>
                    <a href="/scan" class="btn btn-primary" style="margin-top: 20px;">Tarama Sayfasına Dön</a>
                `;
            }
        }
        
        function renderReport(data) {
            const container = document.getElementById('reportContent');
            const summary = data.summary;
            
            // Header
            let html = `
                <div class="header">
                    <h1>🔒 Güvenlik Tarama Raporu</h1>
                    <div class="target">${summary.target_url}</div>
                    <p style="color: #666; margin-top: 10px;">
                        Tarama Tarihi: ${new Date(summary.scan_date).toLocaleString('tr-TR')} | 
                        Süre: ${Math.floor(summary.scan_duration_seconds / 60)} dakika
                    </p>
                </div>
            `;
            
            // Executive Summary
            html += `
                <div class="exec-summary">
                    <h2>📋 Yönetici Özeti</h2>
                    <p>${data.executive_summary}</p>
                </div>
            `;
            
            // Summary Cards
            html += '<div class="summary-grid">';
            html += `
                <div class="summary-card total">
                    <div class="number">${summary.total_findings}</div>
                    <div class="label">Toplam Bulgu</div>
                </div>
            `;
            
            summary.findings_by_risk.forEach(item => {
                if (item.count > 0) {
                    const labels = {
                        'critical': 'Kritik',
                        'high': 'Yüksek',
                        'medium': 'Orta',
                        'low': 'Düşük',
                        'info': 'Bilgi'
                    };
                    html += `
                        <div class="summary-card ${item.risk_level}">
                            <div class="number">${item.count}</div>
                            <div class="label">${labels[item.risk_level]}</div>
                        </div>
                    `;
                }
            });
            html += '</div>';
            
            // Findings
            html += '<div class="section"><h2>🔍 Detaylı Bulgular</h2><div class="findings-list">';
            
            if (data.findings.length === 0) {
                html += '<p style="text-align: center; padding: 40px; color: #666;">Güvenlik açığı bulunamadı.</p>';
            } else {
                data.findings.forEach(finding => {
                    const riskLabels = {
                        'critical': 'Kritik',
                        'high': 'Yüksek',
                        'medium': 'Orta',
                        'low': 'Düşük',
                        'info': 'Bilgi'
                    };
                    
                    html += `
                        <div class="finding ${finding.risk_level}">
                            <div class="finding-header">
                                <div class="finding-title">${finding.title}</div>
                                <span class="risk-badge ${finding.risk_level}">${riskLabels[finding.risk_level]}</span>
                            </div>
                            <div class="finding-details">
                                <p><strong>📍 Etkilenen URL:</strong> ${finding.affected_url}</p>
                                <p><strong>📝 Açıklama:</strong> ${finding.description}</p>
                                ${finding.cwe_id ? `<p><strong>🔖 CWE ID:</strong> ${finding.cwe_id}</p>` : ''}
                                ${finding.cvss_score ? `<p><strong>⚡ CVSS Skoru:</strong> ${finding.cvss_score}</p>` : ''}
                                <div class="recommendation">
                                    <strong>💡 Öneri:</strong> ${finding.recommendation}
                                </div>
                                <div class="metadata">
                                    <span>🔧 Araç: ${finding.tool_name}</span>
                                    <span>📅 Tespit: ${new Date(finding.found_at).toLocaleString('tr-TR')}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += '</div></div>';
            
            // Recommendations
            if (data.recommendations && data.recommendations.length > 0) {
                html += `
                    <div class="section">
                        <div class="recommendations-section">
                            <h3>💡 Genel Öneriler</h3>
                            <ul>
                                ${data.recommendations.map(rec => `<li>${rec}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            }
            
            // Actions
            html += `
                <div class="actions">
                    <a href="/scan" class="btn btn-primary">🔍 Yeni Tarama</a>
                    <a href="/" class="btn btn-secondary">🏠 Ana Sayfa</a>
                    <button onclick="window.print()" class="btn btn-secondary">🖨️ Yazdır</button>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        // Sayfa yüklendiğinde raporu getir
        loadReport();
    </script>
</body>
</html>
