<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarama Raporu - {{ app_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid #667eea;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .target {
            color: #667eea;
            font-size: 1.3em;
            font-weight: 600;
        }
        
        .exec-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .exec-summary h2 {
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        
        .exec-summary p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid;
        }
        
        .summary-card.critical { border-color: #d32f2f; }
        .summary-card.high { border-color: #f57c00; }
        .summary-card.medium { border-color: #fbc02d; }
        .summary-card.low { border-color: #388e3c; }
        .summary-card.info { border-color: #1976d2; }
        .summary-card.total { border-color: #667eea; }
        
        .summary-card .number {
            font-size: 3em;
            font-weight: bold;
            color: #333;
        }
        
        .summary-card .label {
            color: #666;
            margin-top: 5px;
            font-size: 1.1em;
        }
        
        .section {
            margin: 40px 0;
        }
        
        .section h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .findings-list {
            margin-top: 20px;
        }
        
        .finding {
            background: white;
            border: 2px solid #e0e0e0;
            border-left: 5px solid;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .finding:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }
        
        .finding.critical { border-left-color: #d32f2f; }
        .finding.high { border-left-color: #f57c00; }
        .finding.medium { border-left-color: #fbc02d; }
        .finding.low { border-left-color: #388e3c; }
        .finding.info { border-left-color: #1976d2; }
        
        .finding-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .finding-title {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
        }
        
        .risk-badge {
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .risk-badge.critical { background: #d32f2f; }
        .risk-badge.high { background: #f57c00; }
        .risk-badge.medium { background: #fbc02d; color: #000; }
        .risk-badge.low { background: #388e3c; }
        .risk-badge.info { background: #1976d2; }
        
        .finding-details {
            margin: 15px 0;
        }
        
        .finding-details p {
            margin: 10px 0;
            line-height: 1.6;
            color: #555;
        }
        
        .finding-details strong {
            color: #333;
        }
        
        .recommendation {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }
        
        .recommendation strong {
            color: #2e7d32;
        }
        
        .metadata {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
            color: #666;
        }
        
        .recommendations-section {
            background: #fff3e0;
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid #ff9800;
        }
        
        .recommendations-section h3 {
            color: #e65100;
            margin-bottom: 15px;
        }
        
        .recommendations-section ul {
            list-style-position: inside;
            line-height: 2;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .loading {
            text-align: center;
            padding: 60px;
        }
        
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media print {
            body {
                background: white;
            }
            
            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Rapor yükleniyor...</p>
        </div>
        
        <div id="reportContent" style="display: none;"></div>
    </div>
    
    <script>
        const scanId = window.location.pathname.split('/').pop();
        
        async function loadReport() {
            try {
                const response = await fetch(`/api/v1/reports/${scanId}/detailed`);
                
                if (!response.ok) {
                    throw new Error('Rapor yüklenemedi');
                }
                
                const data = await response.json();
                
                // Loading gizle
                document.getElementById('loading').style.display = 'none';
                document.getElementById('reportContent').style.display = 'block';
                
                // Raporu oluştur
                renderReport(data);
                
            } catch (error) {
                const loading = document.getElementById('loading');
                loading.textContent = '';

                const title = document.createElement('h2');
                title.style.color = '#d32f2f';
                title.textContent = '❌ Hata';

                const message = document.createElement('p');
                message.textContent = error.message;

                const link = document.createElement('a');
                link.href = '/scan';
                link.className = 'btn btn-primary';
                link.style.marginTop = '20px';
                link.textContent = 'Tarama Sayfasına Dön';

                loading.appendChild(title);
                loading.appendChild(message);
                loading.appendChild(link);
            }
        }
        
        function renderReport(data) {
            const container = document.getElementById('reportContent');
            container.textContent = '';
            const summary = data.summary || {};
            const riskLabels = {
                'critical': 'Kritik',
                'high': 'Yüksek',
                'medium': 'Orta',
                'low': 'Düşük',
                'info': 'Bilgi'
            };
            const normalizeRiskLevel = (value) => {
                const allowed = ['critical', 'high', 'medium', 'low', 'info'];
                const normalized = String(value || '').toLowerCase();
                return allowed.includes(normalized) ? normalized : 'info';
            };

            const header = document.createElement('div');
            header.className = 'header';
            const title = document.createElement('h1');
            title.textContent = '🔒 Güvenlik Tarama Raporu';
            const target = document.createElement('div');
            target.className = 'target';
            target.textContent = summary.target_url || '-';
            const meta = document.createElement('p');
            meta.style.color = '#666';
            meta.style.marginTop = '10px';
            const scanDate = summary.scan_date ? new Date(summary.scan_date) : null;
            const scanDateText = scanDate && !Number.isNaN(scanDate.valueOf())
                ? scanDate.toLocaleString('tr-TR')
                : '-';
            const durationMinutes = Number.isFinite(summary.scan_duration_seconds)
                ? Math.floor(summary.scan_duration_seconds / 60)
                : 0;
            meta.textContent = `Tarama Tarihi: ${scanDateText} | Süre: ${durationMinutes} dakika`;
            header.appendChild(title);
            header.appendChild(target);
            header.appendChild(meta);
            container.appendChild(header);

            const execSummary = document.createElement('div');
            execSummary.className = 'exec-summary';
            const execTitle = document.createElement('h2');
            execTitle.textContent = '📋 Yönetici Özeti';
            const execText = document.createElement('p');
            execText.textContent = data.executive_summary || '';
            execSummary.appendChild(execTitle);
            execSummary.appendChild(execText);
            container.appendChild(execSummary);

            const summaryGrid = document.createElement('div');
            summaryGrid.className = 'summary-grid';

            const totalCard = document.createElement('div');
            totalCard.className = 'summary-card total';
            const totalNumber = document.createElement('div');
            totalNumber.className = 'number';
            totalNumber.textContent = String(summary.total_findings ?? 0);
            const totalLabel = document.createElement('div');
            totalLabel.className = 'label';
            totalLabel.textContent = 'Toplam Bulgu';
            totalCard.appendChild(totalNumber);
            totalCard.appendChild(totalLabel);
            summaryGrid.appendChild(totalCard);

            (summary.findings_by_risk || []).forEach(item => {
                if (item.count > 0) {
                    const riskLevel = normalizeRiskLevel(item.risk_level);
                    const card = document.createElement('div');
                    card.className = `summary-card ${riskLevel}`;
                    const number = document.createElement('div');
                    number.className = 'number';
                    number.textContent = String(item.count ?? 0);
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = riskLabels[riskLevel] || 'Bilgi';
                    card.appendChild(number);
                    card.appendChild(label);
                    summaryGrid.appendChild(card);
                }
            });
            container.appendChild(summaryGrid);

            const findingsSection = document.createElement('div');
            findingsSection.className = 'section';
            const findingsTitle = document.createElement('h2');
            findingsTitle.textContent = '🔍 Detaylı Bulgular';
            const findingsList = document.createElement('div');
            findingsList.className = 'findings-list';
            findingsSection.appendChild(findingsTitle);
            findingsSection.appendChild(findingsList);

            if (!data.findings || data.findings.length === 0) {
                const empty = document.createElement('p');
                empty.style.textAlign = 'center';
                empty.style.padding = '40px';
                empty.style.color = '#666';
                empty.textContent = 'Güvenlik açığı bulunamadı.';
                findingsList.appendChild(empty);
            } else {
                data.findings.forEach(finding => {
                    const riskLevel = normalizeRiskLevel(finding.risk_level);
                    const item = document.createElement('div');
                    item.className = `finding ${riskLevel}`;

                    const headerRow = document.createElement('div');
                    headerRow.className = 'finding-header';
                    const titleEl = document.createElement('div');
                    titleEl.className = 'finding-title';
                    titleEl.textContent = finding.title || 'Bilinmeyen bulgu';
                    const badge = document.createElement('span');
                    badge.className = `risk-badge ${riskLevel}`;
                    badge.textContent = riskLabels[riskLevel] || 'Bilgi';
                    headerRow.appendChild(titleEl);
                    headerRow.appendChild(badge);

                    const details = document.createElement('div');
                    details.className = 'finding-details';

                    const affected = document.createElement('p');
                    const affectedLabel = document.createElement('strong');
                    affectedLabel.textContent = '📍 Etkilenen URL:';
                    affected.appendChild(affectedLabel);
                    affected.appendChild(document.createTextNode(` ${finding.affected_url || '-'}`));

                    const description = document.createElement('p');
                    const descLabel = document.createElement('strong');
                    descLabel.textContent = '📝 Açıklama:';
                    description.appendChild(descLabel);
                    description.appendChild(document.createTextNode(` ${finding.description || ''}`));

                    details.appendChild(affected);
                    details.appendChild(description);

                    if (finding.cwe_id) {
                        const cwe = document.createElement('p');
                        const cweLabel = document.createElement('strong');
                        cweLabel.textContent = '🔖 CWE ID:';
                        cwe.appendChild(cweLabel);
                        cwe.appendChild(document.createTextNode(` ${finding.cwe_id}`));
                        details.appendChild(cwe);
                    }

                    if (finding.cvss_score) {
                        const cvss = document.createElement('p');
                        const cvssLabel = document.createElement('strong');
                        cvssLabel.textContent = '⚡ CVSS Skoru:';
                        cvss.appendChild(cvssLabel);
                        cvss.appendChild(document.createTextNode(` ${finding.cvss_score}`));
                        details.appendChild(cvss);
                    }

                    const recommendation = document.createElement('div');
                    recommendation.className = 'recommendation';
                    const recLabel = document.createElement('strong');
                    recLabel.textContent = '💡 Öneri:';
                    recommendation.appendChild(recLabel);
                    recommendation.appendChild(document.createTextNode(` ${finding.recommendation || ''}`));

                    const metadata = document.createElement('div');
                    metadata.className = 'metadata';
                    const toolSpan = document.createElement('span');
                    toolSpan.textContent = `🔧 Araç: ${finding.tool_name || '-'}`;
                    const dateSpan = document.createElement('span');
                    const foundDate = finding.found_at ? new Date(finding.found_at) : null;
                    const foundText = foundDate && !Number.isNaN(foundDate.valueOf())
                        ? foundDate.toLocaleString('tr-TR')
                        : '-';
                    dateSpan.textContent = `📅 Tespit: ${foundText}`;
                    metadata.appendChild(toolSpan);
                    metadata.appendChild(dateSpan);

                    details.appendChild(recommendation);
                    details.appendChild(metadata);

                    item.appendChild(headerRow);
                    item.appendChild(details);
                    findingsList.appendChild(item);
                });
            }

            container.appendChild(findingsSection);

            if (Array.isArray(data.recommendations) && data.recommendations.length > 0) {
                const section = document.createElement('div');
                section.className = 'section';
                const recommendations = document.createElement('div');
                recommendations.className = 'recommendations-section';
                const recTitle = document.createElement('h3');
                recTitle.textContent = '💡 Genel Öneriler';
                const list = document.createElement('ul');
                data.recommendations.forEach(rec => {
                    const li = document.createElement('li');
                    li.textContent = rec;
                    list.appendChild(li);
                });
                recommendations.appendChild(recTitle);
                recommendations.appendChild(list);
                section.appendChild(recommendations);
                container.appendChild(section);
            }

            const actions = document.createElement('div');
            actions.className = 'actions';
            const scanLink = document.createElement('a');
            scanLink.href = '/scan';
            scanLink.className = 'btn btn-primary';
            scanLink.textContent = '🔍 Yeni Tarama';
            const homeLink = document.createElement('a');
            homeLink.href = '/';
            homeLink.className = 'btn btn-secondary';
            homeLink.textContent = '🏠 Ana Sayfa';
            const printBtn = document.createElement('button');
            printBtn.className = 'btn btn-secondary';
            printBtn.textContent = '🖨️ Yazdır';
            printBtn.addEventListener('click', () => window.print());
            actions.appendChild(scanLink);
            actions.appendChild(homeLink);
            actions.appendChild(printBtn);
            container.appendChild(actions);
        }
        
        // Sayfa yüklendiğinde raporu getir
        loadReport();
    </script>
</body>
</html>
