services:
  app:
    build: .
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: sqlite+aiosqlite:////app/data/weppentest.db
      ZAP_API_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-changeme}
      API_KEY: ${API_KEY:-}
      API_KEY_REQUIRED: ${API_KEY_REQUIRED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - weppentest-data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      zap:
        condition: service_healthy
        required: false
    networks: [weppentest]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: [scanners]
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:-changeme}
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.key=${ZAP_API_KEY:-changeme}", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]
    expose: ["8080"]
    volumes:
      - zap-data:/home/zap/.ZAP
    networks: [weppentest]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/JSON/core/view/version/?apikey=$${ZAP_API_KEY:-changeme}' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  weppentest-data:
  zap-data:

networks:
  weppentest:
    driver: bridge
